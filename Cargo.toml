[package]
name = "new-iris-terminal"
version = "0.1.0"
edition = "2021"
description = "Terminal emulator for InterSystems IRIS"
license = "MIT"
repository = "https://github.com/consistem/newIrisTerminal"

[dependencies]
eframe = { version = "0.28", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.28"
portable-pty = "0.8"
vte = "0.13"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
quick-xml = "0.36"
keyring = "2"
dirs = "5"
crossbeam-channel = "0.5"
anyhow = "1"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"

[features]
default = []
plugins = ["dep:wasmtime"]

[dependencies.wasmtime]
version = "23"
optional = true

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[lib]
name = "new_iris_terminal"
path = "src/lib.rs"

[[bin]]
name = "new-iris-terminal"
path = "src/main.rs"
