[package]
name = "new-iris-terminal"
version = "0.1.12"
edition = "2021"
description = "Terminal emulator for InterSystems IRIS"
license = "MIT"
repository = "https://github.com/ccsJoaoAzevedo/newIrisTerminal"
build = "build.rs"

[dependencies]
eframe = { version = "0.28", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.28"
portable-pty = "0.8"
vte = "0.13"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
quick-xml = "0.36"
keyring = "2"
dirs = "5"
# System font discovery for the terminal font picker. Pure Rust, so it adds no
# C toolchain requirement on any platform we build for.
fontdb = "0.24"
crossbeam-channel = "0.5"
anyhow = "1"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
image = "0.24"
# The update check: a blocking HTTPS GET against the GitHub releases API, and
# the JSON it answers with. `ureq` is the small end of the HTTP clients - no
# async runtime - which matters for a check that runs once at startup.
ureq = { version = "2", features = ["json"] }
serde_json = "1"
# The main window's HWND, for pinning it to the desktop. Already in the tree
# through eframe, which does not re-export it.
raw-window-handle = "0.6"

[features]
default = []
plugins = ["dep:wasmtime"]

[dependencies.wasmtime]
version = "23"
optional = true

# Reading the InterSystems launcher's server list, which lives in the registry.
# Already in the dependency tree via portable-pty, so this adds no download.
[target.'cfg(windows)'.dependencies]
winreg = "0.10"
# Pinning to the desktop: a WinEvent hook and a few window-placement calls;
# and the open-file dialog the screen saver picks its picture with.
# Already in the dependency tree, so this adds no download.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"

# Debug builds are linked once per test binary, and full debug info is most of
# what each ld.exe holds in memory. Line tables keep file:line in our own
# backtraces; the dependencies, which nobody steps through, carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[lib]
name = "new_iris_terminal"
path = "src/lib.rs"

[[bin]]
name = "new-iris-terminal"
path = "src/main.rs"
# The binary is one call to `lib::run` and has no tests: building a harness
# for it was a link that tested nothing.
test = false
